<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lobster Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0c;
    color: #e8e6e1;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .container { max-width: 480px; }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 3rem;
    margin-bottom: 16px;
    color: #c44b2f;
  }
  p {
    font-size: 16px;
    color: #8a8880;
    line-height: 1.7;
    margin-bottom: 32px;
  }
  a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8a8880;
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 24px;
    transition: all 0.3s ease;
  }
  a:hover {
    color: #c44b2f;
    border-color: rgba(196, 75, 47, 0.3);
  }
</style>
</head>
<body>
<div class="container">
  <h1>404</h1>
  <p>This part of the ocean floor hasn't been mapped yet. The lobsters are still exploring.</p>
  <a href="/">Return to the playground</a>
</div>
</body>
</html>
